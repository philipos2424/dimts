services:
  edge:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: dimts
      POSTGRES_USER: dimts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private pilot env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dimts -d dimts"]
      interval: 10s
      timeout: 5s
      retries: 10
  whisper:
    build:
      context: .
      dockerfile: server/whisper/Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_API_TOKEN: ${WHISPER_API_TOKEN:?Set WHISPER_API_TOKEN}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - whisper-models:/app/.data/whisper-models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3104/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env.pilot.local
    environment:
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://dimts:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/dimts
      TRANSCRIBE_PROVIDER: whisper
      WHISPER_BASE_URL: http://whisper:3104
    ports:
      - "127.0.0.1:${DIMTS_HTTP_PORT:-3103}:3000"
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "const r=await fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(3000)}); if(!r.ok)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  certificates:
  caddy-config:
  database:
  whisper-models:
