<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dimts Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">ድምፅ</span> Dimts <span class="muted">Console</span></div>
    <nav id="tabs" class="tabs" hidden>
      <button data-tab="today" class="on">Today</button>
      <button data-tab="growth">Growth</button>
      <button data-tab="revenue">Revenue</button>
      <button data-tab="operations">Operations</button>
      <button data-tab="customers">Customers</button>
      <button data-tab="compliance">Compliance</button>
      <button data-tab="access">Access log</button>
    </nav>
    <select id="range" aria-label="Period" hidden>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <span id="stamp" class="muted small"></span>
    <button id="signout" class="btn" hidden>Sign out</button>
  </header>
  <p class="notice">Staff access is logged. This console shows account, usage and billing metadata only. Call recordings, transcripts, notes and contacts belong to our customers and are not available here.</p>
  <main id="main"><p class="muted">Loading…</p></main>
  <div id="tip" class="tip" hidden></div>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
